    <!-- PRELOADER CSS -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #website-loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            circle at 20% 45%,
            rgba(0, 145, 255, 0.14),
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(0, 102, 255, 0.09),
            transparent 35%
          ),
          #050b14;
        overflow: hidden;
        transition:
          opacity 0.7s ease,
          visibility 0.7s ease;
      }

      #website-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }

      /* Animated Logo */

      .loader-logo-wrapper {
        position: relative;
        width: 125px;
        height: 125px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 35px;
      }

      .loader-ring {
        position: absolute;
        inset: 0;
        border: 2px solid transparent;
        border-top-color: #159cff;
        border-right-color: rgba(21, 156, 255, 0.3);
        border-radius: 50%;
        animation: loaderRotate 2s linear infinite;
        box-shadow: 0 0 18px rgba(0, 145, 255, 0.12);
      }

      .loader-ring::before {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px dashed rgba(0, 153, 255, 0.5);
        border-radius: 50%;
        animation: loaderRotateReverse 8s linear infinite;
      }

      .loader-logo {
        width: 90px;
        height: 90px;
        object-fit: contain;
        border-radius: 50%;
        padding: 13px;
        background: rgba(10, 30, 50, 0.85);
        border: 1px solid rgba(0, 153, 255, 0.3);
        box-shadow: 0 0 30px rgba(0, 145, 255, 0.2);
        animation: logoPulse 2s ease-in-out infinite;
      }

      /* Website Name */

      .loader-domain {
        font-family: Arial, sans-serif;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 1.5px;
        color: #f1f7ff;
        margin-bottom: 12px;
      }

      .loader-domain span {
        color: #159cff;
      }

      /* Developer Name */

      .loader-developer {
        font-family: Arial, sans-serif;
        font-size: 17px;
        font-weight: 700;
        color: #d8e5f5;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
      }

      .loader-role {
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 4px;
        color: #159cff;
        text-transform: uppercase;
      }

      /* Loading Animation */

      .loader-progress {
        width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        margin-top: 35px;
        overflow: hidden;
      }

      .loader-progress-bar {
        height: 100%;
        width: 40%;
        border-radius: 20px;
        background: linear-gradient(
          90deg,
          #0878dc,
          #19a5ff,
          #8bd5ff
        );
        box-shadow: 0 0 12px #159cff;
        animation: loadingProgress 1.5s ease-in-out infinite;
      }

      .loader-status {
        margin-top: 14px;
        color: #8298b0;
        font-family: Arial, sans-serif;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      /* Background Effects */

      .loader-glow {
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        background: rgba(0, 130, 255, 0.06);
        filter: blur(80px);
        animation: glowMove 5s ease-in-out infinite alternate;
      }

      .loader-dot {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #159cff;
        box-shadow: 0 0 15px #159cff;
        animation: dotBlink 2s ease-in-out infinite;
      }

      .dot-one {
        top: 20%;
        left: 25%;
      }

      .dot-two {
        bottom: 25%;
        right: 23%;
        animation-delay: 0.8s;
      }

      .dot-three {
        top: 30%;
        right: 18%;
        animation-delay: 1.2s;
      }

      /* Keyframes */

      @keyframes loaderRotate {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes loaderRotateReverse {
        to {
          transform: rotate(-360deg);
        }
      }

      @keyframes logoPulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 20px rgba(0, 145, 255, 0.15);
        }

        50% {
          transform: scale(1.06);
          box-shadow: 0 0 35px rgba(0, 145, 255, 0.35);
        }
      }

      @keyframes loadingProgress {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(350%);
        }
      }

      @keyframes glowMove {
        from {
          transform: translate(-80px, -30px);
        }

        to {
          transform: translate(80px, 40px);
        }
      }

      @keyframes dotBlink {
        0%, 100% {
          opacity: 0.2;
          transform: scale(0.7);
        }

        50% {
          opacity: 1;
          transform: scale(1.5);
        }
      }

      /* Mobile Responsive */

      @media (max-width: 600px) {
        .loader-logo-wrapper {
          width: 105px;
          height: 105px;
          margin-bottom: 30px;
        }

        .loader-logo {
          width: 76px;
          height: 76px;
        }

        .loader-domain {
          font-size: 25px;
        }

        .loader-developer {
          font-size: 15px;
        }

        .loader-role {
          font-size: 10px;
          letter-spacing: 3px;
        }

        .loader-progress {
          width: 150px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-ring,
        .loader-ring::before,
        .loader-logo,
        .loader-progress-bar,
        .loader-glow,
        .loader-dot {
          animation: none;
        }
      }
    </style>
  </head>

  <body>

    <!-- WEBSITE PRELOADER -->
    <div id="website-loader">

      <div class="loader-glow"></div>

      <div class="loader-dot dot-one"></div>
      <div class="loader-dot dot-two"></div>
      <div class="loader-dot dot-three"></div>

      <div class="loader-content">

        <!-- Logo -->
        <div class="loader-logo-wrapper">
          <div class="loader-ring"></div>

          <img
            src="/assets/Isign.png"
            alt="Ishwar Logo"
            class="loader-logo"
          />
        </div>

        <!-- Domain Name -->
        <h1 class="loader-domain">
          ishwarweb<span>.in</span>
        </h1>

        <!-- Developer Name -->
        <h2 class="loader-developer">
          Ishwar Sharma
        </h2>

        <!-- Profession -->
        <p class="loader-role">
          Full Stack Developer
        </p>

        <!-- Loading Bar -->
        <div class="loader-progress">
          <div class="loader-progress-bar"></div>
        </div>

        <p class="loader-status">
          Initializing Experience...
        </p>

      </div>
    </div>

    <!-- REACT APPLICATION -->
    <div id="root"></div>

    <!-- PRELOADER SCRIPT -->
    <script>
      (function () {
        const loader = document.getElementById("website-loader");

        if (!loader) return;

        let pageLoaded = false;

        function hideLoader() {
          if (pageLoaded) return;

          pageLoaded = true;

          loader.classList.add("loader-hidden");

          setTimeout(() => {
            loader.remove();
          }, 800);
        }

        window.addEventListener("load", () => {
          setTimeout(hideLoader, 700);
        });

        // Fallback in case some resource takes too long.
        setTimeout(hideLoader, 10000);

      })();
    </script>

    <!-- React Entry Point -->
    <script type="module" src="/src/main.jsx"></script>

  </body>
